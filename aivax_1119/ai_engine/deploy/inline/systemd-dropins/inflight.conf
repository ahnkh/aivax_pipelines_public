# ORG5000 P0-2 (2026-08-30): raise ChatGate→Pipeline concurrency.
# Live unit still hardcodes 256 in ExecStart; this drop-in replaces it.
# Repo template already uses ${AIVAX_POLICY_API_MAX_INFLIGHT:-384} — env below is source of truth after next install.
[Service]
Environment=AIVAX_POLICY_API_MAX_INFLIGHT=384
Environment=AIVAX_POLICY_API_POOL_LIMIT=384
ExecStart=
ExecStart=/home1/aivax/aivax-venv/bin/python3 -u /home1/aivax/ai_engine/core/ai_policy_engine.py \
  --socket /run/aivax/policy.sock \
  --socket-mode 660 \
  --log-level INFO \
  --server-url http://127.0.0.1 \
  --port 9099 \
  --policy-api-timeout-ms 60000 \
  --policy-api-acquire-timeout-ms 200 \
  --policy-api-max-inflight 384 \
  --policy-api-pool-limit 384 \
  --policy-api-failure-policy open \
  --log-payload \
  --payload-preview-bytes 512
