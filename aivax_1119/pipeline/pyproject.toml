[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aivax-pipeline"
version = "0.1.0"
description = "AIVAX Pipeline"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiohttp>=3.13,<4",
  "docx2txt>=0.9,<1",
  "fastapi>=0.123,<1",
  "filetype>=1.2,<2",
  "grpcio>=1.76,<2",
  "httpx>=0.28,<1",
  "jwt>=1.4,<2",
  "orjson>=3.10,<4",
  "olefile>=0.47,<1",
  "pandas>=2.3,<3",
  "passlib>=1.7,<2",
  "pdfplumber>=0.11,<1",
  "pikepdf>=10.17,<11",
  "Pillow>=10,<13",
  "PyMuPDF>=1.24,<2",
  "pydantic>=2.12,<3",
  "protobuf>=6,<8",
  "psutil>=7,<8",
  "pyhwp==0.1b15",
  "python-dotenv>=1,<2",
  "python-docx>=1,<2",
  "python-magic>=0.4,<1",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1,<2",
  "pytesseract>=0.3,<1",
  "redis>=5,<7",
  "requests>=2.32,<3",
  "schedule>=1.2,<2",
  "openpyxl>=3.1,<4",
  "urllib3>=2.5,<3",
  "xlrd>=1.2,<2",
  "uvicorn[standard]>=0.38,<1",
  "uvloop>=0.22,<1",
  "valkey>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.7"]

[project.scripts]
aivax-pipeline = "main:main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "main",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "src*",
  "third_party.markany*",
]
namespaces = true

[tool.setuptools.package-data]
"third_party.markany" = ["README.md"]

[tool.setuptools.data-files]
"share/aivax-pipeline/swagger" = [
  "docs/swagger/*.json",
  "docs/swagger/index.html",
  "docs/swagger/README.md",
]
"share/aivax-pipeline/swagger/details" = [
  "docs/swagger/details/*.html",
  "docs/swagger/details/*.css",
  "docs/swagger/details/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "pipeline_container_integration: Docker Fluent Bit/OpenSearch/Valkey와 실제 Pipeline/CSO JVM 통합 검증 (명시 실행)",
  "analysis_log_e2e: 실제 HTTP 서버, Valkey notification stream, Fluent Bit spool 파일을 검증하는 E2E 테스트",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["third_party/markany"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
