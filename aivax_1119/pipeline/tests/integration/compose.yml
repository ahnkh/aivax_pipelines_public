services:
  opensearch:
    image: opensearchproject/opensearch:3.3.2@sha256:798cf28e226a32f5c928dd1ed9478dd3a33d2212176aad3679020088ad3afa1a
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: PipelineIntegration_2026!
    ports:
      - "127.0.0.1::9200"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --silent --fail --insecure
          -u "admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD"
          'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s'
          > /dev/null
      interval: 2s
      timeout: 5s
      retries: 90
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  valkey:
    image: valkey/valkey:8.1-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    command: [valkey-server, --save, "", --appendonly, "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 1s
      timeout: 2s
      retries: 30

  fluent-bit:
    image: fluent/fluent-bit:4.1.1@sha256:2a5cb41f99b7c5f3386bb34d42ce3b19eb47fbef6d93b64c0bd4afe9e6ec389c
    depends_on:
      opensearch:
        condition: service_healthy
    command: [-c, /fluent-bit/etc/fluent-bit.conf]
    environment:
      FLUENT_BIT_PARSERS_FILE: /fluent-bit/etc/parsers.conf
      FLUENT_BIT_LOG_FILE: /state/fluent-bit.log
      FLUENT_BIT_INPUT_PATH: /bulk_logs/aivax_log#*.json
      FLUENT_BIT_DB_PATH: /state/tail.db
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: admin
      OPENSEARCH_PASS: PipelineIntegration_2026!
    volumes:
      - type: bind
        source: ${AIVAX_INTEGRATION_BULK_DIR:?Set an absolute test bulk_logs directory}
        target: /bulk_logs
        read_only: true
      - type: bind
        source: ${AIVAX_INTEGRATION_STATE_DIR:?Set an absolute Fluent Bit state directory}
        target: /state
      - ../../../../infra/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../../../../infra/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro

volumes:
  opensearch-data:
